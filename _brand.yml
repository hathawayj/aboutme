# Original newspaper-editorial palette: warm paper, ink, and one restrained accent.
color:
  palette:
    ink: "#171717"
    accent: "#8b1e2d"
    paper: "#f8f5ef"
    muted: "#5f5a54"
  foreground: ink
  background: paper
  primary: accent
typography:
  fonts:
    - family: Source Sans 3
      source: google
    - family: Source Serif 4
      source: google
  base: Source Sans 3
  headings:
    family: Source Serif 4
    weight: 700
